version: 0.2
env:
  variables:
    # Ryuk only exists on Docker Hub, whose anonymous limit CodeBuild exhausts.
    # The build container is ephemeral, so leftover test containers die with it.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    # dockerd runs inside this build container, so published ports are on localhost.
    # Without this Testcontainers reports the bridge IP and the local seed guard skips.
    TESTCONTAINERS_HOST_OVERRIDE: localhost
phases:
  install:
    runtime-versions:
      java: corretto25
    commands:
      - java -version
      - docker info >/dev/null
      - python3 -m unittest discover -s aws/scripts/tests -v
  build:
    commands:
      # Privileged mode is required for the existing PostgreSQL/MinIO Testcontainers tests.
      - ./mvnw --batch-mode --no-transfer-progress clean verify
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      - bash aws/scripts/package_artifact.sh
reports:
  junit:
    files:
      - '**/*.xml'
    base-directory: target/surefire-reports
    file-format: JUNITXML
artifacts:
  base-directory: deployment-artifact
  files:
    - '**/*'
