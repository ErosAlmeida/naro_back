spring:
  # Sem SPRING_PROFILES_ACTIVE o app sobe como "local" (IDE, mvn spring-boot:run).
  # Em produção, informe o perfil: com qualquer perfil ativo o "local" não entra.
  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    validate-on-migrate: true

  # O padrão do Spring (1MB) recusaria a maioria das fotos.
  # O frontend valida o mesmo limite de imagem antes do upload.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      resourceserver:
        jwt:
          authorities-claim-expressions:
            - "['realm_access']['roles']"

          authority-prefix: "ROLE_"

          principal-claim-name: "preferred_username"


# UI em /swagger-ui.html, contrato em /v3/api-docs.
springdoc:
  # É o Accept que o front manda; o HAL continua vindo nele,
  # porque o Spring usa HAL como o JSON padrão.
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # O token sobrevive ao F5 da página.
    persist-authorization: true
    # Botão Authorize -> login no Keycloak (Authorization Code + PKCE).
    # O client precisa existir no realm; veja docs/api.md.
    oauth:
      client-id: naro-swagger
      use-pkce-with-authorization-code-grant: true


app:
  storage:
    s3:
      presigned-url-duration: 30m

# Criptografia ponta a ponta do chat privado (docs/e2ee.md).
#   available  endpoints de chaves ligados; mensagens E2EE aceitas
#   required   chat privado somente E2EE: mensagem nova sem criptografia é recusada
# required=true exige available=true (a aplicação não sobe sem isso).
naro:
  security:
    e2ee:
      available: ${E2EE_AVAILABLE:false}
      required: ${E2EE_REQUIRED:false}

  # Notificações Web Push (docs/notifications.md). Sem as chaves VAPID o push
  # fica desligado e todo o resto funciona igual. A chave privada só existe no
  # ambiente do servidor: nunca no Git, no frontend ou em logs.
  # Gere o par com scripts/generate-vapid-keys.sh.
  push:
    vapid:
      public-key: ${NARO_PUSH_VAPID_PUBLIC_KEY:}
      private-key: ${NARO_PUSH_VAPID_PRIVATE_KEY:}
      # Contato para os push services: mailto:voce@dominio ou https://seu-site
      subject: ${NARO_PUSH_VAPID_SUBJECT:}
    # NAME_AND_PREVIEW | NAME_ONLY | GENERIC. Mensagens E2EE nunca têm prévia.
    preview: ${NARO_PUSH_PREVIEW:NAME_AND_PREVIEW}

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
