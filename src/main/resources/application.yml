spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/naro
    username: postgres
    password: naro123
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    validate-on-migrate: true

  # O padrão do Spring (1MB) recusaria a maioria das fotos.
  # O frontend valida o mesmo limite de imagem antes do upload.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8180/realms/social"

          authorities-claim-expressions:
            - "['realm_access']['roles']"

          authority-prefix: "ROLE_"

          principal-claim-name: "preferred_username"


# UI em /swagger-ui.html, contrato em /v3/api-docs.
springdoc:
  # É o Accept que o front manda; o HAL continua vindo nele,
  # porque o Spring usa HAL como o JSON padrão.
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # O token sobrevive ao F5 da página.
    persist-authorization: true
    # Botão Authorize -> login no Keycloak (Authorization Code + PKCE).
    # O client precisa existir no realm; veja docs/api.md.
    oauth:
      client-id: naro-swagger
      use-pkce-with-authorization-code-grant: true


app:
  storage:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      access-key: naro
      secret-key: naro12345
      bucket: naro-publications
      presigned-url-duration: 30m

  websocket:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000