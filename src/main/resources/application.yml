spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/naro
    username: postgres
    password: naro123
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8180/realms/social"

          authorities-claim-expressions:
            - "['realm_access']['roles']"

          authority-prefix: "ROLE_"

          principal-claim-name: "preferred_username"