spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/naro
    username: postgres
    # Credenciais fictícias, somente do Docker Compose de desenvolvimento.
    password: naro123
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/social

app:
  storage:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      access-key: naro
      secret-key: naro12345
      bucket: naro-publications
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  websocket:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  seed:
    # Canais, publicações com imagem, comentários, likes e follows de exemplo
    # (seed/content.json + seed/images). Roda uma vez, no primeiro startup com o
    # banco sem o seed, e só com banco e MinIO em localhost.
    # Veja com.naro.seed.LocalContentSeeder.
    enabled: true

# Localmente o chat já roda em modo E2EE obrigatório, para testar o fluxo
# completo (passkey em http://localhost:3000). E2EE_REQUIRED=false volta ao legado.
naro:
  security:
    e2ee:
      available: ${E2EE_AVAILABLE:true}
      required: ${E2EE_REQUIRED:true}
