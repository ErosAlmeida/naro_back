server:
  port: 8080
  # Somente o ALB pode chegar à EC2; preserva esquema/host dos links HAL.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          # O issuer continua público e validado, mesmo buscando chaves em loopback.
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://127.0.0.1:8081/auth/realms/social/protocol/openid-connect/certs}

app:
  storage:
    s3:
      region: ${AWS_REGION}
      bucket: ${S3_BUCKET}
      # Sem endpoint e sem access/secret key: SDK usa a IAM Role da EC2.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  websocket:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  seed:
    enabled: false

# Fase 1 do E2EE: infraestrutura no ar, chat sem mudança para ninguém.
# Fase 2 (depois da validação): E2EE_REQUIRED=true, ou troque o padrão abaixo.
naro:
  security:
    e2ee:
      available: ${E2EE_AVAILABLE:true}
      required: ${E2EE_REQUIRED:false}
