services:

  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: naro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: naro123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak-postgres:
    image: postgres:17-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    command:
      - start-dev
      - --spi-theme--static-max-age=-1
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

    ports:
      - "8180:8080"

    volumes:
      - ./infra/keycloak/themes/naro:/opt/keycloak/themes/naro:ro

    depends_on:
      - keycloak-postgres

  # Habilita cadastro e configura o client por código, inclusive em realms já existentes.
  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.7.3
    entrypoint: ["/bin/bash", "/opt/naro-keycloak/configure.sh"]
    environment:
      KEYCLOAK_SERVER: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KC_CLI_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      NARO_REALM: ${NARO_REALM:-social}
      NARO_CLIENT_ID: ${NARO_CLIENT_ID:-naro-web}
      NARO_APP_URL: ${NARO_APP_URL:-http://localhost:3000}
    volumes:
      - ./infra/keycloak:/opt/naro-keycloak:ro
    depends_on:
      - keycloak
    restart: "no"


  minio:
    image: quay.io/minio/minio:latest
    container_name: naro-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: naro
      MINIO_ROOT_PASSWORD: naro12345

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  keycloak_postgres_data:
  minio_data:
